# Fails a pull request or push that adds a hardcoded secret (SAL-13322).
# Only the commits the change adds are scanned, so secrets already in history
# do not fail every PR. False positive: add an inline `gitleaks:allow` comment
# or a fingerprint line to .gitleaksignore.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits this change adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            # A force-push can leave the old tip out of the checkout; fetch it rather than narrow the scan.
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && ! git fetch --no-tags --quiet origin "$BASE_SHA"; then
              echo "::error::Cannot fetch the previous tip $BASE_SHA, so the new commits cannot be isolated."
              exit 1
            fi
            range="$BASE_SHA..$HEAD_SHA"
          else
            # This push created the branch: scan every commit no other branch already has.
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -vx -e "refs/remotes/origin/$GITHUB_REF_NAME" -e refs/remotes/origin/HEAD | paste -sd' ' - || true)
            range="$HEAD_SHA${others:+ --not $others}"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
